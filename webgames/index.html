<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <header class="site-header">
    <a class="site-logo" href="/">
      <img src="/imgs/SkullAndCrossBonesLogo.png" alt="" width="28" height="28">
      <span>Goonie Software</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span>
    </button>
    <nav class="site-nav" id="site-nav">
      <a href="/">Home</a>
      <div class="nav-dropdown">
        <a href="/games">Games</a>
        <ul>
          <li><a href="/games/lifter">Lifter</a></li>
        </ul>
      </div>
      <div class="nav-dropdown">
        <a href="/webgames" aria-current="page">Webgames</a>
        <ul>
          <li><a href="/webgames/pimpwarz">PimpWars</a></li>
          <li><a href="/webgames/lord">Legend of the Red Dragon</a></li>
          <li><a href="/webgames/solar_realms_elite">Solar Realms Elite</a></li>
        </ul>
      </div>
      <div class="nav-dropdown">
        <a href="/software">Software</a>
        <ul>
          <li><a href="/software/steamdb">steamdb</a></li>
        </ul>
      </div>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>

  <div class="page-hero">
    <div class="page">
      <h1>Webgames</h1>
      <p>Playable in the browser — no install required.</p>
    </div>

  <main class="page">
    <div class="webgames-grid">
      <a class="webgame-link" href="/webgames/pimpwarz">
        <figure>

      <a class="webgame-link" href="/webgames/lord">

        </figure>

      <a class="webgame-link" href="/webgames/solar_realms_elite">
        <figure>
          <img src="/webgames/imgs/sre-cover.png" alt="Solar Realms Elite" width="1024" height="1024">

  <script>
    (function () {
      var header = document.querySelector('.site-header');
      var toggle = document.querySelector('.nav-toggle');

      toggle.addEventListener('click', function () {

        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
